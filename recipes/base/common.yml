# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:

  - type: signing

  - type: justfiles
    validate: true
    install: true
    include:
      - 30-secureboot.just

  - type: files
    files:
      - source: base
        destination: /

  - type: script
    snippets:
      - mkdir -p /etc/dnf
      - echo -e "[main]\nmax_parallel_downloads=20\nfastestmirror=True" >> /etc/dnf/dnf.conf

  - type: dnf
    repos:
      nonfree: negativo17
    replace:
      - from-repo: fedora-multimedia
        skip-unavailable: true
        packages:
          - libva
          - mesa-dri-drivers
          - mesa-filesystem
          - mesa-libEGL
          - mesa-libGL
          - mesa-libgbm
          - mesa-va-drivers
          - mesa-vulkan-drivers
          - libheif

  - type: dnf
    install:
      packages:
        - repo: fedora-multimedia
          skip-unavailable: true
          packages:
            - intel-vaapi-driver
    replace:
      - from-repo: fedora-multimedia
        skip-unavailable: true
        packages:
          - libva-intel-media-driver
          - intel-gmmlib
          - intel-mediasdk

  - type: dnf
    install:
      packages:
        - libopenjph
        - repo: fedora-multimedia
          packages:
            - libva-utils
            - pipewire-libs-extra
            - heif-pixbuf-loader
    replace:
      - from-repo: fedora-multimedia
        packages:
          - old: ffmpeg-free
            new: ffmpeg
          - old: libfdk-aac-free
            new: libfdk-aac
          - old: libavcodec-free
            new: libavcodec

  - type: dnf
    install:
      packages:
        - repo: fedora-multimedia
          packages:
            - ffmpeg-libs

  - type: dnf
    repos:
      cleanup: true
      copr:
        - ublue-os/packages
        - ublue-os/staging
        - bieszczaders/kernel-cachyos-addons
        - abn/throttled
        - atim/starship
        - aquacash5/nerd-fonts

    install:
      skip-unavailable: true
      packages:
        - sbsign
        - ublue-os-udev-rules
        - fedora-repos-archive
        - alsa-firmware
        - distrobox
        - ffmpegthumbnailer
        - fuse-libs
        - fzf
        - just
        - lshw
        - nvtop
        - openrgb-udev-rules
        - pam-u2f
        - pamu2fcfg
        - powerstat
        - smartmontools
        - solaar-udev
        - symlinks
        - tmux
        - usbmuxd
        - wl-clipboard
        - openssh-askpass
        - gvfs-fuse
        - gvfs-smb
        - gvfs-nfs
        - gvfs-mtp
        - uupd
        - steam-devices
        - gamescope
        - throttled
        - iio-sensor-proxy
        - libvirt
        - qemu-kvm
        - virt-manager
        - waydroid
        - tailscale
        - zenity
        - p7zip
        - p7zip-plugins
        - unrar
        - starship
        - adwaita-mono-nerd-fonts

      exclude:
        - google-noto-sans-cjk-vf-fonts
        - default-fonts-cjk-sans

    remove:
      auto-remove: false
      packages:
        - fedora-flathub-remote
        - fedora-third-party
        - fedora-workstation-repositories
        - thermald
        - toolbox
        - firefox
        - firefox-langpacks

    replace:
      # mitigate upstream packaging bug: https://bugzilla.redhat.com/show_bug.cgi?id=2332429
      # swap the incorrectly installed OpenCL-ICD-Loader for ocl-icd, the expected package
      - from-repo: fedora
        install-weak-deps: false
        packages:
          - new: ocl-icd
            old: OpenCL-ICD-Loader

  - type: brew
    nofile-limits: true
    brew-analytics: false

  - type: systemd
    system:
      masked:
        - rpm-ostreed-automatic.timer
        - bootc-fetch-apply-updates.timer
      enabled:
        - bootc-fetch-apply-updates.service
        - tailscaled.service
        - uupd.timer
      disabled:
        - NetworkManager-wait-online.service

  - type: script
    env:
      CSFG: /usr/lib/systemd/system-generators/coreos-sulogin-force-generator

    snippets:
      # Inject CoreOS generator to bypass locked recovery prompts in an emergency
      - curl -sSLo ${CSFG} https://raw.githubusercontent.com/coreos/fedora-coreos-config/refs/heads/stable/overlay.d/05core/usr/lib/systemd/system-generators/coreos-sulogin-force-generator
      - chmod +x ${CSFG}
      #
      # Set Keyboard layout in GRUB to Spanish
      - echo 'KEYMAP="es"' > /etc/vconsole.conf
      #
      # Starship configuration
      - echo 'export STARSHIP_CONFIG=/etc/starship.toml' > /etc/profile.d/starship.sh
      - echo 'eval "$(starship init bash)"' > /etc/profile.d/starship.sh
    scripts:
      - install-appimage-thumbnailer.sh
