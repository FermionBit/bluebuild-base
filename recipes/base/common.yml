# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:

  # ========================================================================
  # 1. IMAGE CRYPTOGRAPHIC SIGNING
  # ========================================================================
  - type: signing
  
  # ========================================================================
  # 2. AUTOMATION SHORTCUTS (JUSTFILES)
  # ========================================================================
  - type: justfiles
    validate: true
    install: true
    include:
      - 30-secureboot.just
      
  # ========================================================================
  # 3. HOST FILE OVERLAYS
  # ========================================================================
  - type: files
    files:
      - source: base
        destination: /
      
  # ========================================================================
  # 4. HOST SOFTWARE & REPOSITORIES
  # ========================================================================
  - type: dnf
    repos:
      cleanup: true
      nonfree: negativo17
      copr:
        - ublue-os/packages
        - ublue-os/staging
        - abn/throttled
        - kylegospo/system76-scheduler
      files:
        - insync.repo

    # --- Hardware Codec & Base Driver Swaps ---
    replace:
      - from-repo: fedora-multimedia
        skip-unavailable: true
        packages:
          - libva
          - mesa-dri-drivers
          - mesa-filesystem
          - mesa-libEGL
          - mesa-libGL
          - mesa-libgbm
          - mesa-va-drivers
          - mesa-vulkan-drivers
          - libheif
          - libva-intel-media-driver
          - intel-gmmlib
          - intel-mediasdk
          - old: ffmpeg-free
            new: ffmpeg
          - old: libfdk-aac-free
            new: libfdk-aac
          - old: libavcodec-free
            new: libavcodec

      # Upstream mitigation step for OpenCL mapping tracks
      - from-repo: fedora
        install-weak-deps: false
        packages:
          - new: ocl-icd
            old: OpenCL-ICD-Loader

    # --- Native Software Deployment Stack ---
    install:
      skip-unavailable: true
      packages:
        - fedora-repos-archive
        - ublue-os-udev-rules
        - ublue-os-media-automount-udev
        - android-udev-rules
        - steam-devices
        - openrgb-udev-rules
        - solaar-udev
        - alsa-firmware
        - iio-sensor-proxy
        - distrobox
        - throttled
        - system76-scheduler
        - tailscale
        - insync
        - smartmontools
        - powerstat
        - pam-u2f
        - pamu2fcfg
        - openssh-askpass
        - fuse
        - zenity
        - libvirt
        - qemu-kvm
        - virt-manager
        - waydroid
        - symlinks
        - lshw
        - just
        - fzf
        - tmux
        - uupd
        - wl-clipboard
        - gvfs-fuse
        - gvfs-smb
        - gvfs-nfs
        - gvfs-mtp
        - nvtop
        - eza
        - bat
        
        - repo: fedora-multimedia
          skip-unavailable: true
          packages:
            - intel-vaapi-driver
            - libopenjph
        - repo: fedora-multimedia
          packages:
            - libva-utils
            - pipewire-libs-extra
            - heif-pixbuf-loader
            - ffmpeg-libs
            - ffmpegthumbnailer

      # --- Redundant Fonts & Architecture Blocklist ---
      exclude:
        - google-noto-sans-cjk-vf-fonts
        - default-fonts-cjk-sans
        - "*.i686"

    # --- Default Base Image Software Removals ---
    remove:
      auto-remove: false
      packages:
        - fedora-flathub-remote
        - fedora-third-party
        - fedora-workstation-repositories
        - thermald
        - toolbox
        - firefox
        - firefox-langpacks
        
  # ========================================================================
  # 5. SYSTEMD SERVICE & TIMER DAEMON OVERRIDES
  # ========================================================================
  - type: systemd
    system:
      masked:
        - rpm-ostreed-automatic.timer
        - bootc-fetch-apply-updates.timer
      enabled:
        - bootc-fetch-apply-updates.service
        - system76-scheduler.service
        - tailscaled.service
        - uupd.timer
        
  # ========================================================================
  # 6. BUILD-TIME COMPILATION SNIPPETS (SCRIPTS)
  # ========================================================================
  - type: script
    env:
      CSFG: /usr/lib/systemd/system-generators/coreos-sulogin-force-generator
    snippets:
      - curl -sSLo ${CSFG} https://raw.githubusercontent.com/coreos/fedora-coreos-config/refs/heads/stable/overlay.d/05core/usr/lib/systemd/system-generators/coreos-sulogin-force-generator
      - chmod +x ${CSFG}
      - echo 'KEYMAP="es"' > /etc/vconsole.conf
    scripts:
      - install-appimage-thumbnailer.sh
