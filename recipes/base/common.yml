# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:

  - type: signing
  
  - type: justfiles
    validate: true
    install: true
    include:
      - 30-secureboot.just
      
  - type: files
    files:
      - source: base
        destination: /
      
  - type: dnf
    repos:
      cleanup: true
      nonfree: negativo17
      copr:
        - ublue-os/packages
        - ublue-os/staging
        - abn/throttled
        - kylegospo/system76-scheduler
      files:
        - insync.repo

    replace:
      - from-repo: fedora-multimedia
        skip-unavailable: true
        packages:
          - libva
          - mesa-dri-drivers
          - mesa-filesystem
          - mesa-libEGL
          - mesa-libGL
          - mesa-libgbm
          - mesa-va-drivers
          - mesa-vulkan-drivers
          - libheif
          - libva-intel-media-driver
          - intel-gmmlib
          - intel-mediasdk
          - old: ffmpeg-free
            new: ffmpeg
          - old: libfdk-aac-free
            new: libfdk-aac
          - old: libavcodec-free
            new: libavcodec

      # Mitigate upstream packaging bug: https://bugzilla.redhat.com/show_bug.cgi?id=2332429
      - from-repo: fedora
        install-weak-deps: false
        packages:
          - new: ocl-icd
            old: OpenCL-ICD-Loader

    install:
      skip-unavailable: true
      packages:
        - repo: fedora-multimedia
          skip-unavailable: true
          packages:
            - intel-vaapi-driver
            - libopenjph
        - repo: fedora-multimedia
          packages:
            - libva-utils
            - pipewire-libs-extra
            - heif-pixbuf-loader
            - ffmpeg-libs
            - fedora-repos-archive
            - ublue-os-udev-rules
            - ublue-os-media-automount-udev
            - android-udev-rules
            - steam-devices
            - openrgb-udev-rules
            - solaar-udev
            - alsa-firmware
            - distrobox
            - symlinks
            - lshw
            - smartmontools
            - powerstat
            - just
            - fzf
            - tmux
            - uupd
            - wl-clipboard
            - pam-u2f
            - pamu2fcfg
            - openssh-askpass
            - gvfs-fuse
            - gvfs-smb
            - gvfs-nfs
            - gvfs-mtp
            - nvtop
            - ffmpegthumbnailer
            - throttled
            - iio-sensor-proxy
            - tailscale
            - eza
            - bat
            - fuse
            - system76-scheduler
            - insync
            - zenity
            - libvrt
            - qemu-kvm
            - virt-manager
            - waydroid

      exclude:
        - google-noto-sans-cjk-vf-fonts
        - default-fonts-cjk-sans

    remove:
      auto-remove: false
      packages:
        - fedora-flathub-remote
        - fedora-third-party
        - fedora-workstation-repositories
        - thermald
        - toolbox
        - firefox
        - firefox-langpacks
        
  - type: systemd
    system:
      masked:
        - rpm-ostreed-automatic.timer
        - bootc-fetch-apply-updates.timer
      enabled:
        - bootc-fetch-apply-updates.service
        - system76-scheduler.service
        - tailscaled.service
        - uupd.timer
        
  - type: script
    env:
      CSFG: /usr/lib/systemd/system-generators/coreos-sulogin-force-generator
    snippets:
      # use CoreOS' generator for emergency/rescue boot
      # see detail: https://github.com/ublue-os/main/issues/653
      - curl -sSLo ${CSFG} https://raw.githubusercontent.com/coreos/fedora-coreos-config/refs/heads/stable/overlay.d/05core/usr/lib/systemd/system-generators/coreos-sulogin-force-generator
      - chmod +x ${CSFG}
      # Set system-wide virtual console keyboard layout to Spanish
      - echo 'KEYMAP="es"' > /etc/vconsole.conf
    scripts:
      - install-appimage-thumbnailer.sh