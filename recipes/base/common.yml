# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:

  - type: signing
  
  - type: justfiles
    validate: true
    install: true
    include:
      - 30-secureboot.just
      
  - type: files
    files:
      - source: base
        destination: /
      
  - type: systemd
    system:
      masked:
        - rpm-ostreed-automatic.timer
        - bootc-fetch-apply-updates.timer
      enabled:
        - bootc-fetch-apply-updates.service
        - system76-scheduler.service
        - tailscaled.service
        - uupd.timer
        
  - type: dnf
    repos:
      nonfree: negativo17
    replace:
      - from-repo: fedora-multimedia
        skip-unavailable: true
        packages:
          - libva
          - mesa-dri-drivers
          - mesa-filesystem
          - mesa-libEGL
          - mesa-libGL
          - mesa-libgbm
          - mesa-va-drivers
          - mesa-vulkan-drivers
          - libheif

  - type: dnf
    install:
      packages:
        - repo: fedora-multimedia
          skip-unavailable: true
          packages:
            - intel-vaapi-driver
    replace:
      - from-repo: fedora-multimedia
        skip-unavailable: true
        packages:
          - libva-intel-media-driver
          - intel-gmmlib
          - intel-mediasdk

  - type: dnf
    install:
      packages:
        - libopenjph
        - repo: fedora-multimedia
          packages:
            - libva-utils
            - pipewire-libs-extra
            - heif-pixbuf-loader
    replace:
      - from-repo: fedora-multimedia
        packages:
          - old: ffmpeg-free
            new: ffmpeg
          - old: libfdk-aac-free
            new: libfdk-aac
          - old: libavcodec-free
            new: libavcodec

  - type: dnf
    install:
      packages:
        - repo: fedora-multimedia
          packages:
            - ffmpeg-libs

  - type: dnf
    repos:
      cleanup: true
      copr:
        - ublue-os/packages
        - ublue-os/staging
        - abn/throttled
        - kylegospo/system76-scheduler
      files:
        - insync.repo
    install:
      skip-unavailable: true
      packages:
        - uupd
        - fedora-repos-archive
        - ublue-os-udev-rules
        - ublue-os-media-automount-udev
        - android-udev-rules
        - steam-devices
        - openrgb-udev-rules
        - solaar-udev
        - alsa-firmware
        - throttled
        - system76-scheduler
        - iio-sensor-proxy
        - powerstat
        - distrobox
        - libvirt
        - qemu-kvm
        - virt-manager
        - waydroid
        - pam-u2f
        - pamu2fcfg
        - openssh-askpass
        - tailscale
        - insync
        - lshw
        - smartmontools
        - nvtop
        - fuse
        - gvfs-fuse
        - symlinks
        - just
        - fzf
        - tmux
        - eza
        - bat
        - zenity
        - wl-clipboard
        - ffmpegthumbnailer
        - gvfs-smb
        - gvfs-nfs
        - gvfs-mtp
    
      exclude:
        - google-noto-sans-cjk-vf-fonts
        - default-fonts-cjk-sans
        - "*.i686"

    remove:
      auto-remove: false
      packages:
        - fedora-flathub-remote
        - fedora-third-party
        - fedora-workstation-repositories
        - thermald
        - toolbox
        - firefox
        - firefox-langpacks

    replace:
      - from-repo: fedora
        install-weak-deps: false
        packages:
          - new: ocl-icd
            old: OpenCL-ICD-Loader

  - type: script
    env:
      CSFG: /usr/lib/systemd/system-generators/coreos-sulogin-force-generator
    
    snippets:
      # Inject CoreOS generator to bypass locked recovery prompts in an emergency
      - curl -sSLo ${CSFG} https://raw.githubusercontent.com/coreos/fedora-coreos-config/refs/heads/stable/overlay.d/05core/usr/lib/systemd/system-generators/coreos-sulogin-force-generator
      - chmod +x ${CSFG}
      
      # Hardcode Spanish hardware layout parameters directly into virtual console
      - echo 'KEYMAP="es"' > /etc/vconsole.conf
      
      # Clean up the staging Negativo17 repository definition file to keep host pristine
      - rm -f /etc/yum.repos.d/fedora-negativo17.repo
    scripts:
      - install-appimage-thumbnailer.sh
