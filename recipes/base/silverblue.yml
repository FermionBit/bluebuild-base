---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - ublue-os/packages
      files:
        - insync.repo
      keys:
        - https://d2t3ff60b2tol4.cloudfront.net/repomd.xml.key
        
    install:
      exclude:
        - totem-video-thumbnailer
        - gnome-software-rpm-ostree
      packages:
        - adw-gtk3-theme
        - ibus-unikey
        - ibus-mozc
        - bazaar
        - insync
        - insync-nautilus
        
    remove:
      auto-remove: false
      packages:
        - totem-video-thumbnailer
        - gnome-software-rpm-ostree
        - gnome-software
        - gnome-tour
