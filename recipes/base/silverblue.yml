---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - ublue-os/packages
      files:
        - insync.repo
    install:
      exclude:
        - totem-video-thumbnailer
        - gnome-software-rpm-ostree
      packages:
        - adw-gtk3-theme
        - ibus-unikey
        - ibus-mozc
        - bazaar
        - https://cdn.insynchq.com/builds/linux/3.9.5.60024/insync-nautilus-3.9.5.60024-1.noarch.rpm
    remove:
      auto-remove: false
      packages:
        - totem-video-thumbnailer
        - gnome-software-rpm-ostree
        - gnome-software
        - gnome-tour
