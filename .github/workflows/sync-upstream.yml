name: Scheduled Upstream Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  workflows: write 

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          
      - name: Sync upstream changes
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          target_sync_branch: upstream
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_repo: blue-build/bluebuild-base
          upstream_sync_branch: main
          test_mode: false
